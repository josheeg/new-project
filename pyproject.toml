[project]
name = "new-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "josheeg", email = "josheeg@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "build>=1.6.1",
    "coverage>=7.16.2",
    "flit-core>=4.1.0",
    "hatchling>=1.32.4",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
    "setuptools>=84.0.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.8",
    "sphinx-rtd-theme>=3.1.0",
    "twine>=7.0.0",
]

[project.scripts]
new-project = "new_project:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
