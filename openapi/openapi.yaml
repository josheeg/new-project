openapi: "3.0.3"  # connexion 3.3 requires 3.0.x; no 3.1-only features used
info:
  title: driven-dev API
  version: "0.1.0"
  description: Minimal spec driving pydantic model generation (see codegen.ps1 / codegen.sh).
paths:
  /health:
    get:
      operationId: get_health
      x-openapi-router-controller: driven_dev.api
      summary: Service health check
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        version:
          type: string
          description: Running service version
