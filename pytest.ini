# pytest config lives here (NOT pyproject.toml): pytest-watch probes pytest's
# inifile and parses it with configparser (plain INI) — it cannot parse TOML,
# so ptw crashes if pyproject.toml is pytest's configfile. See AGENTS.md.
[pytest]
testpaths = tests
asyncio_mode = auto
addopts =
    -ra
    --strict-config
    --strict-markers
    --cov=driven_dev
    --cov-report=term-missing
markers =
    spec: executable specification (Gherkin scenario or spec-marked test)
